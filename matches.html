<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#080b10">

<title>PreziScore — Match</title>

<link rel="stylesheet"
      href="style.css">

<style>

/* =====================================================
   MATCH DETAILS
===================================================== */

.details-page {
    padding-bottom: 100px;
}


/* HEADER */

.details-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 0;
}

.back-btn {
    width: 38px;
    height: 38px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: var(--card);
    color: white;

    font-size: 18px;
    cursor: pointer;
}


/* MATCH HERO */

.match-hero {
    padding: 22px 14px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;

    text-align: center;
}

.league-name {
    color: var(--muted);
    font-size: 10px;
}

.detail-status {
    margin-top: 8px;

    color: var(--primary);
    font-size: 10px;
    font-weight: 900;
}


/* TEAMS */

.detail-teams {
    display: grid;

    grid-template-columns:
        1fr 90px 1fr;

    align-items: center;

    gap: 8px;

    margin-top: 22px;
}

.detail-team {
    text-align: center;
}

.detail-logo {
    width: 58px;
    height: 58px;

    margin: auto;

    display: grid;
    place-items: center;

    background: var(--card-2);
    border: 1px solid var(--border);

    border-radius: 15px;

    overflow: hidden;

    font-size: 22px;
}

.detail-logo img {
    width: 44px;
    height: 44px;

    object-fit: contain;
}

.detail-team-name {
    margin-top: 9px;

    font-size: 11px;
    font-weight: 800;
}

.detail-score {
    font-size: 25px;
    font-weight: 900;
}

.detail-minute {
    margin-top: 5px;

    color: var(--muted);
    font-size: 9px;
}


/* DATE */

.match-date {
    margin-top: 17px;

    color: var(--muted);

    font-size: 9px;
}


/* SECTIONS */

.detail-section {
    margin-top: 15px;

    padding: 15px;

    background: var(--card);
    border: 1px solid var(--border);

    border-radius: 17px;
}

.detail-section h3 {
    margin-bottom: 13px;

    font-size: 13px;
}


/* LOADING */

.detail-loading {
    padding: 45px 10px;

    text-align: center;

    color: var(--muted);

    font-size: 11px;
}


/* ERROR */

.detail-error {
    display: none;

    margin-top: 15px;

    padding: 25px 15px;

    text-align: center;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 17px;
}

.detail-error.show {
    display: block;
}

.detail-error div {
    font-size: 30px;
}

.detail-error h3 {
    margin-top: 8px;
    font-size: 14px;
}

.detail-error p {
    margin-top: 5px;

    color: var(--muted);
    font-size: 9px;
}


/* STAT ROW */

.stat-row {
    margin-bottom: 14px;
}

.stat-head {
    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 9px;
}

.stat-bar {
    height: 6px;

    display: flex;

    overflow: hidden;

    background: var(--card-2);

    border-radius: 10px;
}

.stat-home {
    width: 50%;

    background: var(--primary);
}

.stat-away {
    width: 50%;

    background: #68717f;
}


/* EVENT */

.event-row {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 0;

    border-bottom:
        1px solid var(--border);

    font-size: 9px;
}

.event-row:last-child {
    border-bottom: 0;
}

.event-icon {
    font-size: 14px;
}

.event-minute {
    color: var(--muted);
}


/* NAV */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 100;

}

</style>

</head>


<body>


<main class="main-content details-page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="details-header">

    <button
        class="back-btn"
        onclick="history.back()"
        aria-label="Retour"
    >
        ←
    </button>

    <strong>
        Détails du match
    </strong>

</header>


<!-- =====================================================
     LOADING
===================================================== -->

<div
    id="detailLoading"
    class="detail-loading"
>

    Chargement du match...

</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="detailError"
    class="detail-error"
>

    <div>⚠️</div>

    <h3>
        Match introuvable
    </h3>

    <p>
        Impossible de charger les détails
        de ce match.
    </p>

</div>


<!-- =====================================================
     MATCH
===================================================== -->

<section
    id="matchHero"
    class="match-hero"
    style="display:none;"
>

    <div
        id="leagueName"
        class="league-name"
    >
        Football
    </div>


    <div
        id="detailStatus"
        class="detail-status"
    >
        À VENIR
    </div>


    <div class="detail-teams">


        <!-- HOME -->

        <div class="detail-team">

            <div
                id="homeLogo"
                class="detail-logo"
            >
                ⚽
            </div>

            <div
                id="homeName"
                class="detail-team-name"
            >
                Équipe domicile
            </div>

        </div>


        <!-- SCORE -->

        <div>

            <div
                id="detailScore"
                class="detail-score"
            >
                - : -
            </div>

            <div
                id="detailMinute"
                class="detail-minute"
            >
                À venir
            </div>

        </div>


        <!-- AWAY -->

        <div class="detail-team">

            <div
                id="awayLogo"
                class="detail-logo"
            >
                ⚽
            </div>

            <div
                id="awayName"
                class="detail-team-name"
            >
                Équipe visiteuse
            </div>

        </div>

    </div>


    <div
        id="matchDate"
        class="match-date"
    >
        -
    </div>

</section>


<!-- =====================================================
     STATISTICS
===================================================== -->

<section
    id="statisticsSection"
    class="detail-section"
    style="display:none;"
>

    <h3>
        📊 Statistiques
    </h3>

    <div id="statistics">
    </div>

</section>


<!-- =====================================================
     EVENTS
===================================================== -->

<section
    id="eventsSection"
    class="detail-section"
    style="display:none;"
>

    <h3>
        ⚡ Événements
    </h3>

    <div id="events">
    </div>

  </section>
  <!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <span>⌂</span>
        <small>Accueil</small>
    </a>

    <a href="match.html" class="nav-item active">
        <span>⚽</span>
        <small>Matchs</small>
    </a>

    <a href="competitions.html" class="nav-item">
        <span>🏆</span>
        <small>Compétitions</small>
    </a>

    <a href="news.html" class="nav-item">
        <span>📰</span>
        <small>News</small>
    </a>

    <a href="profile.html" class="nav-item">
        <span>👤</span>
        <small>Profil</small>
    </a>

</nav>


<!-- =====================================================
     API
===================================================== -->

<script src="api.js"></script>


<!-- =====================================================
     MATCH DETAILS ENGINE
===================================================== -->

<script>

"use strict";


const params =
    new URLSearchParams(
        window.location.search
    );


const fixtureId =
    params.get("id");


const loading =
    document.getElementById(
        "detailLoading"
    );

const errorBox =
    document.getElementById(
        "detailError"
    );

const hero =
    document.getElementById(
        "matchHero"
    );


/* =====================================================
   LOAD MATCH
===================================================== */

async function loadMatchDetails() {

    if (!fixtureId) {

        showError();

        return;

    }


    try {

        const match =
            await PreziAPI
                .getMatchDetails(
                    fixtureId
                );


        if (!match) {

            showError();

            return;

        }


        renderMatch(
            match
        );


        loadExtraDetails();


    }

    catch (error) {

        console.error(
            "PreziScore details:",
            error
        );

        showError();

    }

}


/* =====================================================
   RENDER MATCH
===================================================== */

function renderMatch(match) {

    loading.style.display =
        "none";

    hero.style.display =
        "block";


    document.getElementById(
        "leagueName"
    ).textContent =
        match.competition ||
        "Football";


    document.getElementById(
        "homeName"
    ).textContent =
        match.home?.name ||
        "Domicile";


    document.getElementById(
        "awayName"
    ).textContent =
        match.away?.name ||
        "Visiteur";


    document.getElementById(
        "detailScore"
    ).textContent =
        `${match.home?.score ?? "-"} : ${
            match.away?.score ?? "-"
        }`;


    let status =
        "À VENIR";


    if (
        match.status === "live"
    ) {

        status =
            match.minute !== null
                ? `🔴 ${match.minute}'`
                : "🔴 LIVE";

    }


    if (
        match.status === "finished"
    ) {

        status =
            "TERMINÉ";

    }


    document.getElementById(
        "detailStatus"
    ).textContent =
        status;


    document.getElementById(
        "detailMinute"
    ).textContent =
        match.status === "live"
            ? (
                match.minute !== null
                    ? `${match.minute}'`
                    : "LIVE"
              )
            : match.status === "finished"
                ? "Fin du match"
                : "À venir";


    document.getElementById(
        "matchDate"
    ).textContent =
        formatDate(
            match.time
        );


    setLogo(
        "homeLogo",
        match.home?.logo
    );


    setLogo(
        "awayLogo",
        match.away?.logo
    );

}


/* =====================================================
   LOGO
===================================================== */

function setLogo(id, url) {

    const box =
        document.getElementById(id);


    if (!url) {

        box.textContent =
            "⚽";

        return;

    }


    box.innerHTML =
        `<img src="${escapeHTML(url)}"
              alt="Logo">`;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date.toLocaleString(
        "fr-FR",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


/* =====================================================
   EXTRA DETAILS
===================================================== */

async function loadExtraDetails() {

    try {

        const data =
            await PreziAPI
                .getMatchExtra(
                    fixtureId
                );


        if (!data) {

            return;

        }


        renderStatistics(
            data.statistics
        );


        renderEvents(
            data.events
        );

    }

    catch (error) {

        console.warn(
            "Details supplémentaires:",
            error
        );

    }

}


/* =====================================================
   STATISTICS
===================================================== */

function renderStatistics(stats) {

    if (
        !Array.isArray(stats) ||
        !stats.length
    ) {

        return;

    }


    const section =
        document.getElementById(
            "statisticsSection"
        );


    const box =
        document.getElementById(
            "statistics"
        );


    section.style.display =
        "block";


    const home =
        stats[0]?.statistics || [];


    const away =
        stats[1]?.statistics || [];


    const rows = {};


    home.forEach(item => {

        rows[item.type] = {

            home:
                item.value

        };

    });


    away.forEach(item => {

        if (!rows[item.type]) {

            rows[item.type] = {};

        }


        rows[item.type].away =
            item.value;

    });


    box.innerHTML = "";


    Object.entries(rows)
        .forEach(
            ([name, value]) => {

                box.innerHTML += `

                    <div class="stat-row">

                        <div class="stat-head">

                            <span>
                                ${escapeHTML(name)}
                            </span>

                            <span>
                                ${
                                    escapeHTML(
                                        value.home ?? "-"
                                    )
                                }
                                -
                                ${
                                    escapeHTML(
                                        value.away ?? "-"
                                    )
                                }
                            </span>

                        </div>

                        <div class="stat-bar">

                            <div
                                class="stat-home"
                                style="width:50%"
                            ></div>

                            <div
                                class="stat-away"
                                style="width:50%"
                            ></div>

                        </div>

                    </div>

                `;

            }
        );

}


/* =====================================================
   EVENTS
===================================================== */

function renderEvents(events) {

    if (
        !Array.isArray(events) ||
        !events.length
    ) {

        return;

    }


    const section =
        document.getElementById(
            "eventsSection"
        );


    const box =
        document.getElementById(
            "events"
        );


    section.style.display =
        "block";


    box.innerHTML = "";


    events.forEach(event => {

        const icon =
            event.type === "Goal"
                ? "⚽"
                : event.type === "Card"
                    ? (
                        event.detail ===
                        "Red Card"
                            ? "🟥"
                            : "🟨"
                      )
                    : "🔄";


        box.innerHTML += `

            <div class="event-row">

                <span class="event-icon">
                    ${icon}
                </span>

                <span class="event-minute">
                    ${event.time?.elapsed ?? "-"}'
                </span>

                <strong>
                    ${escapeHTML(
                        event.player?.name ||
                        "Événement"
                    )}
                </strong>

                <span>
                    ${escapeHTML(
                        event.detail || ""
                    )}
                </span>

            </div>

        `;

    });

}


/* =====================================================
   ERROR
===================================================== */

function showError() {

    loading.style.display =
        "none";

    hero.style.display =
        "none";

    errorBox.classList.add(
        "show"
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadMatchDetails();

</script>


</main>


</body>

</html>
