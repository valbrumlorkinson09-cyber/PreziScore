<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#080b10">

<meta name="description"
      content="PreziScore — Détails du match">

<title>PreziScore — Match</title>

<link rel="stylesheet" href="style.css">


<style>

/* =====================================================
   PREZISCORE — MATCH DETAILS
===================================================== */

.details-page {
    padding-bottom: 100px;
}


/* =====================================================
   RETOUR
===================================================== */

.back-row {
    padding: 18px 0 8px;
}

.back-btn {
    border: 0;
    background: transparent;

    color: var(--muted);

    font-family: inherit;
    font-size: 11px;
    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   HEADER MATCH
===================================================== */

.match-header-card {
    margin-top: 10px;

    padding: 20px 14px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    text-align: center;
}


/* =====================================================
   COMPÉTITION
===================================================== */

.detail-competition {
    color: var(--muted);

    font-size: 10px;
    font-weight: 800;

    margin-bottom: 12px;
}


/* =====================================================
   STATUT
===================================================== */

.detail-status {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 6px;

    padding: 5px 9px;

    border-radius: 8px;

    font-size: 9px;
    font-weight: 900;

    margin-bottom: 18px;
}

.detail-status.live {
    color: #ff304f;

    background:
        rgba(255,48,79,0.10);
}

.detail-status.finished {
    color: #8b95a3;

    background:
        rgba(139,149,163,0.10);
}

.detail-status.upcoming {
    color: var(--primary);

    background:
        rgba(0,230,118,0.08);
}


/* =====================================================
   ÉQUIPES
===================================================== */

.detail-teams {
    display: grid;

    grid-template-columns:
        1fr 80px 1fr;

    align-items: center;

    gap: 8px;
}


.detail-team {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 9px;

    min-width: 0;
}


.detail-logo {
    width: 58px;
    height: 58px;

    display: grid;

    place-items: center;

    background: var(--card-2);

    border: 1px solid var(--border);

    border-radius: 15px;

    font-size: 23px;

    overflow: hidden;
}


.detail-logo img {
    width: 44px;
    height: 44px;

    object-fit: contain;
}


.detail-team-name {
    width: 100%;

    font-size: 10px;

    font-weight: 800;

    line-height: 1.3;
}


.detail-score {
    font-size: 27px;

    font-weight: 900;

    letter-spacing: -1px;
}


.detail-score small {
    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 9px;

    font-weight: 700;
}


/* =====================================================
   INFORMATIONS MATCH
===================================================== */

.match-info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 17px;
}


.info-box {
    padding: 10px 5px;

    background: var(--card-2);

    border-radius: 11px;

    text-align: center;
}


.info-box span {
    display: block;

    color: var(--muted);

    font-size: 8px;

    margin-bottom: 4px;
}


.info-box strong {
    display: block;

    font-size: 9px;

    line-height: 1.3;
}


/* =====================================================
   ONGLETS
===================================================== */

.detail-tabs {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 18px;
}


.detail-tab {
    height: 40px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--card);

    color: var(--muted);

    font-family: inherit;

    font-size: 9px;

    font-weight: 900;

    cursor: pointer;
}


.detail-tab.active {
    color: var(--primary);

    border-color:
        rgba(0,230,118,0.30);

    background:
        rgba(0,230,118,0.08);
}


/* =====================================================
   CONTENU
===================================================== */

.detail-content {
    margin-top: 12px;
}


.detail-panel {
    padding: 16px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;
}


.panel-title {
    margin-bottom: 13px;

    font-size: 12px;

    font-weight: 900;
}


/* =====================================================
   LOADING
===================================================== */

.detail-loading {
    padding: 35px 10px;

    text-align: center;

    color: var(--muted);

    font-size: 10px;
}


/* =====================================================
   ERREUR
===================================================== */

.detail-error {
    padding: 30px 15px;

    text-align: center;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;
}


.detail-error div {
    font-size: 30px;
}


.detail-error h3 {
    margin-top: 8px;

    font-size: 13px;
}


.detail-error p {
    margin-top: 6px;

    color: var(--muted);

    font-size: 10px;
}


/* =====================================================
   STATISTIQUES — HEADER ÉQUIPES
===================================================== */

.stats-container {
    width: 100%;
}


.stats-title {
    padding: 5px 0 14px;

    font-size: 14px;

    font-weight: 900;
}


.stats-teams {
    display: grid;

    grid-template-columns:
        1fr 90px 1fr;

    align-items: center;

    gap: 6px;

    padding: 13px 10px;

    margin-bottom: 12px;

    background: var(--card-2);

    border-radius: 14px;

    text-align: center;
}


.stats-team-home,
.stats-team-away {
    font-size: 10px;

    font-weight: 900;

    line-height: 1.3;
}


.stats-team-home {
    text-align: left;
}


.stats-team-away {
    text-align: right;
}


.stats-vs {
    color: var(--muted);

    font-size: 8px;

    font-weight: 900;
}


/* =====================================================
   SECTION STATISTIQUES
===================================================== */

.stats-section {
    margin-top: 12px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 14px;

    overflow: hidden;
}


.stats-section-title {
    padding: 11px 12px;

    background: var(--card-2);

    color: var(--primary);

    font-size: 9px;

    font-weight: 900;

    letter-spacing: .4px;
}


/* =====================================================
   LIGNE STATISTIQUE
===================================================== */

.stat-line {
    display: grid;

    grid-template-columns:
        55px 1fr 55px;

    align-items: center;

    min-height: 42px;

    padding: 7px 10px;

    border-bottom: 1px solid var(--border);

    text-align: center;
}


.stat-line:last-child {
    border-bottom: 0;
}


.stat-value {
    font-size: 11px;

    font-weight: 900;
}


.stat-value.home {
    text-align: left;
}


.stat-value.away {
    text-align: right;
}


.stat-label {
    color: var(--muted);

    font-size: 9px;

    font-weight: 700;

    line-height: 1.3;

    text-align: center;
}


/* =====================================================
   BARRE STATISTIQUE
===================================================== */

.stat-progress {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 3px;

    padding: 0 10px 8px;
}


.stat-progress-side {
    height: 3px;

    background: var(--card-2);

    border-radius: 5px;

    overflow: hidden;
}


.stat-progress-fill {
    height: 100%;

    background: var(--primary);

    border-radius: 5px;
}


.stat-progress-fill.away {
    margin-left: auto;
}


/* =====================================================
   AUCUNE STATISTIQUE
===================================================== */

.stats-empty {
    padding: 20px 5px;

    color: var(--muted);

    font-size: 10px;

    line-height: 1.6;

    text-align: center;
}


/* =====================================================
   ÉVÉNEMENTS
===================================================== */

.event-row {
    display: grid;

    grid-template-columns:
        45px 1fr 45px;

    align-items: center;

    gap: 8px;

    padding: 11px 0;

    border-bottom: 1px solid var(--border);

    font-size: 9px;
}


.event-row:last-child {
    border-bottom: 0;
}


.event-time {
    color: var(--primary);

    font-weight: 900;
}


.event-center {
    text-align: center;

    font-weight: 700;
}


.event-team {
    color: var(--muted);

    font-size: 8px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 360px) {

    .detail-teams {
        grid-template-columns:
            1fr 70px 1fr;
    }


    .detail-score {
        font-size: 23px;
    }


    .stats-teams {
        grid-template-columns:
            1fr 45px 1fr;
    }


    .stat-line {
        grid-template-columns:
            48px 1fr 48px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="brand">

        <div class="brand-ball">
            ⚽
        </div>

        <div>

            <h1>
                Prezi<span>Score</span>
            </h1>

            <p>
                Football en direct
            </p>

        </div>

    </div>


    <button
        class="search-btn"
        onclick="location.href='match.html'"
        aria-label="Rechercher"
    >
        🔍
    </button>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main-content details-page">


    <!-- RETOUR -->

    <div class="back-row">

        <button
            class="back-btn"
            onclick="history.back()"
        >
            ← Retour aux matchs
        </button>

    </div>


    <!-- =================================================
         MATCH HEADER
    ================================================= -->

    <section
        id="matchHeader"
        class="match-header-card"
    >

        <div class="detail-loading">
            Chargement du match...
        </div>

    </section>


    <!-- =================================================
         TABS
    ================================================= -->

    <div class="detail-tabs">

        <button
            class="detail-tab active"
            data-tab="summary"
        >
            Résumé
        </button>


        <button
            class="detail-tab"
            data-tab="stats"
        >
            Statistiques
        </button>


        <button
            class="detail-tab"
            data-tab="events"
        >
            Événements
        </button>

    </div>


    <!-- =================================================
         CONTENT
    ================================================= -->

    <section
        id="detailContent"
        class="detail-content"
    >

        <div class="detail-loading">
            Chargement des informations...
        </div>

    </section>


</main>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <a
        href="index.html"
        class="nav-item"
    >

        <span>⌂</span>

        <small>
            Accueil
        </small>

    </a>


    <a
        href="match.html"
        class="nav-item active"
    >

        <span>⚽</span>

        <small>
            Matchs
        </small>

    </a>


    <a
        href="competitions.html"
        class="nav-item"
    >

        <span>🏆</span>

        <small>
            Compétitions
        </small>

    </a>


    <a
        href="news.html"
        class="nav-item"
    >

        <span>📰</span>

        <small>
            News
        </small>

    </a>


    <a
        href="profile.html"
        class="nav-item"
    >

        <span>👤</span>

        <small>
            Profil
        </small>

    </a>


</nav>
