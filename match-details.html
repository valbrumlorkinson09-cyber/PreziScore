<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#080b10">

<meta name="description"
      content="PreziScore — Détails du match">

<title>PreziScore — Match</title>

<link rel="stylesheet" href="style.css">


<style>

/* =====================================================
   MATCH DETAILS
===================================================== */

.details-page {
    padding-bottom: 100px;
}


/* =====================================================
   BACK
===================================================== */

.back-row {
    padding: 18px 0 8px;
}

.back-btn {
    border: 0;

    background: transparent;

    color: var(--muted);

    font-family: inherit;

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   MATCH HEADER
===================================================== */

.match-header-card {
    margin-top: 10px;

    padding: 20px 14px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    text-align: center;
}


/* =====================================================
   COMPETITION
===================================================== */

.detail-competition {
    color: var(--muted);

    font-size: 10px;

    font-weight: 800;

    margin-bottom: 14px;
}


/* =====================================================
   STATUS
===================================================== */

.detail-status {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 5px 9px;

    border-radius: 8px;

    font-size: 9px;

    font-weight: 900;

    margin-bottom: 18px;
}

.detail-status.live {
    color: #ff304f;

    background:
        rgba(255,48,79,0.10);
}

.detail-status.finished {
    color: #8b95a3;

    background:
        rgba(139,149,163,0.10);
}

.detail-status.upcoming {
    color: var(--primary);

    background:
        rgba(0,230,118,0.08);
}


/* =====================================================
   TEAMS
===================================================== */

.detail-teams {
    display: grid;

    grid-template-columns:
        1fr 85px 1fr;

    align-items: center;

    gap: 8px;
}


.detail-team {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 9px;

    min-width: 0;
}


.detail-logo {
    width: 58px;
    height: 58px;

    display: grid;

    place-items: center;

    background: var(--card-2);

    border: 1px solid var(--border);

    border-radius: 15px;

    font-size: 23px;

    overflow: hidden;
}


.detail-logo img {
    width: 44px;
    height: 44px;

    object-fit: contain;
}


.detail-team-name {
    width: 100%;

    font-size: 10px;

    font-weight: 800;

    line-height: 1.3;
}


.detail-score {
    font-size: 27px;

    font-weight: 900;

    letter-spacing: -1px;
}


.detail-score small {
    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 9px;

    font-weight: 700;
}


/* =====================================================
   INFO
===================================================== */

.match-info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 17px;
}


.info-box {
    padding: 10px 5px;

    background: var(--card-2);

    border-radius: 11px;

    text-align: center;
}


.info-box span {
    display: block;

    color: var(--muted);

    font-size: 8px;

    margin-bottom: 4px;
}


.info-box strong {
    display: block;

    font-size: 9px;
}


/* =====================================================
   TABS
===================================================== */

.detail-tabs {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 18px;
}


.detail-tab {
    height: 40px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--card);

    color: var(--muted);

    font-family: inherit;

    font-size: 9px;

    font-weight: 900;

    cursor: pointer;
}


.detail-tab.active {
    color: var(--primary);

    border-color:
        rgba(0,230,118,0.30);

    background:
        rgba(0,230,118,0.08);
}


/* =====================================================
   CONTENT
===================================================== */

.detail-content {
    margin-top: 12px;
}


.detail-panel {
    padding: 16px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;
}


.panel-title {
    margin-bottom: 13px;

    font-size: 12px;

    font-weight: 900;
}


/* =====================================================
   LOADING
===================================================== */

.detail-loading {
    padding: 35px 10px;

    text-align: center;

    color: var(--muted);

    font-size: 10px;
}


.detail-error {
    padding: 30px 15px;

    text-align: center;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;
}


.detail-error div {
    font-size: 30px;
}


.detail-error h3 {
    margin-top: 8px;

    font-size: 13px;
}


.detail-error p {
    margin-top: 6px;

    color: var(--muted);

    font-size: 10px;
}


/* =====================================================
   EVENTS
===================================================== */

.event-row {
    display: grid;

    grid-template-columns:
        45px 1fr 45px;

    align-items: center;

    gap: 8px;

    padding: 11px 0;

    border-bottom: 1px solid var(--border);

    font-size: 9px;
}


.event-row:last-child {
    border-bottom: 0;
}


.event-time {
    color: var(--primary);

    font-weight: 900;
}


.event-center {
    text-align: center;

    font-weight: 700;
}


.event-team {
    color: var(--muted);

    font-size: 8px;
}


/* =====================================================
   STATISTICS
===================================================== */

.stat-row {
    margin-bottom: 15px;
}


.stat-head {
    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 9px;

    font-weight: 800;
}


.stat-bars {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 3px;
}


.stat-bar {
    height: 6px;

    background: var(--card-2);

    border-radius: 5px;

    overflow: hidden;
}


.stat-fill {
    height: 100%;

    background: var(--primary);

    border-radius: 5px;
}


</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="brand">

        <div class="brand-ball">
            ⚽
        </div>

        <div>

            <h1>
                Prezi<span>Score</span>
            </h1>

            <p>
                Football en direct
            </p>

        </div>

    </div>


    <button
        class="search-btn"
        onclick="location.href='match.html'"
    >
        🔍
    </button>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main-content details-page">


    <div class="back-row">

        <button
            class="back-btn"
            onclick="history.back()"
        >
            ← Retour aux matchs
        </button>

    </div>


    <!-- MATCH HEADER -->

    <section
        id="matchHeader"
        class="match-header-card"
    >

        <div class="detail-loading">

            Chargement du match...

        </div>

    </section>


    <!-- TABS -->

    <div class="detail-tabs">

        <button
            class="detail-tab active"
            data-tab="summary"
        >
            Résumé
        </button>

        <button
            class="detail-tab"
            data-tab="stats"
        >
            Statistiques
        </button>

        <button
            class="detail-tab"
            data-tab="events"
        >
            Événements
        </button>

    </div>


    <!-- CONTENT -->

    <section
        id="detailContent"
        class="detail-content"
    >

        <div class="detail-loading">

            Chargement des informations...

        </div>

    </section>


</main>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="bottom-nav">

    <a
        href="index.html"
        class="nav-item"
    >

        <span>⌂</span>

        <small>
            Accueil
        </small>

    </a>


    <a
        href="match.html"
        class="nav-item active"
    >

        <span>⚽</span>

        <small>
            Matchs
        </small>

    </a>


    <a
        href="competitions.html"
        class="nav-item"
    >

        <span>🏆</span>

        <small>
            Compétitions
        </small>

    </a>


    <a
        href="news.html"
        class="nav-item"
    >

        <span>📰</span>

        <small>
            News
        </small>

    </a>


    <a
        href="profile.html"
        class="nav-item"
    >

        <span>👤</span>

        <small>
            Profil
        </small>

    </a>

</nav>


<!-- =====================================================
     API
===================================================== -->

<script src="api.js"></script>


<!-- =====================================================
     DETAIL SCRIPT — PART 1
===================================================== -->

<script>

"use strict";


const matchHeader =
    document.getElementById(
        "matchHeader"
    );


const detailContent =
    document.getElementById(
        "detailContent"
    );


const tabs =
    document.querySelectorAll(
        ".detail-tab"
    );


/* ================================
   MATCH ID
================================ */

const params =
    new URLSearchParams(
        window.location.search
    );


const matchId =
    params.get("match");


console.log(
    "⚽ Match ID:",
    matchId
);


/* ================================
   HELPERS
================================ */

function safe(value) {

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(char) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[char];

        }
    );

}


function getStatus(match) {

    return (
        match?.status ||
        "upcoming"
    );

}


function getMinute(match) {

    return (
        match?.minute ??
        null
    );

}


function getScore(
    match,
    side
) {

    return (
        match?.[side]?.score ??
        "-"
    );

}


function getName(
    match,
    side
) {

    return (
        match?.[side]?.name ||
        "Équipe"
    );

}


function getLogo(
    match,
    side
) {

    return (
        match?.[side]?.logo ||
        ""
    );

}


/* ================================
   STATUS TEXT
================================ */

function statusText(match) {

    const status =
        getStatus(match);


    if (
        status === "live"
    ) {

        const minute =
            getMinute(match);


        return minute !== null
            ? `🔴 LIVE • ${minute}'`
            : "🔴 LIVE";

    }


    if (
        status === "finished"
    ) {

        return "TERMINÉ";

    }


    return "À VENIR";

}


/* ================================
   LOAD MATCH
================================ */

async function loadMatch() {

    if (!matchId) {

        showError(
            "Match introuvable",
            "Aucun identifiant de match n'a été fourni."
        );

        return;

    }


    if (
        !window.PreziAPI ||
        typeof PreziAPI.getMatchById !==
        "function"
    ) {

        showError(
            "API indisponible",
            "api.js ne contient pas la fonction du match."
        );

        return;

    }


    try {

        const match =
            await PreziAPI.getMatchById(
                matchId
            );


        if (!match) {

            showError(
                "Match introuvable",
                "Impossible de trouver ce match."
            );

            return;

        }


        window.currentMatch =
            match;


        renderMatchHeader(
            match
        );


        renderSummary(
            match
        );


    }

    catch(error) {

        console.error(
            "Erreur match:",
            error
        );


        showError(
            "Erreur de chargement",
            "Impossible de charger les informations du match."
        );

    }

}


/* ================================
   HEADER
================================ */

function renderMatchHeader(
    match
) {

    const home =
        getName(
            match,
            "home"
        );


    const away =
        getName(
            match,
            "away"
        );


    const homeLogo =
        getLogo(
            match,
            "home"
        );


    const awayLogo =
        getLogo(
            match,
            "away"
        );


    matchHeader.innerHTML = `

        <div class="detail-competition">

            🏆
            ${safe(
                match.competition ||
                "Football"
            )}

        </div>


        <div class="detail-status ${
            safe(
                getStatus(match)
            )
        }">

            ${safe(
                statusText(match)
            )}

        </div>


        <div class="detail-teams">


            <div class="detail-team">

                <div class="detail-logo">

                    ${
                        homeLogo
                            ? `
                                <img
                                    src="${safe(homeLogo)}"
                                    alt="${safe(home)}"
                                >
                              `
                            : "⚽"
                    }

                </div>


                <div class="detail-team-name">

                    ${safe(home)}

                </div>

            </div>


            <div class="detail-score">

                ${safe(
                    getScore(
                        match,
                        "home"
                    )
                )}

                :

                ${safe(
                    getScore(
                        match,
                        "away"
                    )
                )}

                <small>

                    ${
                        getStatus(match)
                        === "live"
                            ? `${safe(
                                getMinute(match)
                                ?? ""
                              )}'`
                            : getStatus(match)
                              === "finished"
                                ? "FT"
                                : "À venir"
                    }

                </small>

            </div>


            <div class="detail-team">

                <div class="detail-logo">

                    ${
                        awayLogo
                            ? `
                                <img
                                    src="${safe(awayLogo)}"
                                    alt="${safe(away)}"
                                >
                              `
                            : "⚽"
                    }

                </div>


                <div class="detail-team-name">

                    ${safe(away)}

                </div>

            </div>

        </div>


        <div class="match-info">

            <div class="info-box">

                <span>
                    DATE
                </span>

                <strong>
                    ${formatDate(match.time)}
                </strong>

            </div>


            <div class="info-box">

                <span>
                    STADE
                </span>

                <strong>
                    ${safe(
                        match.venue ||
                        "—"
                    )}
                </strong>

            </div>


            <div class="info-box">

                <span>
                    ARBITRE
                </span>

                <strong>
                    ${safe(
                        match.referee ||
                        "—"
                    )}
                </strong>

            </div>

        </div>

    `;

}


function formatDate(
    value
) {

    if (!value) {

        return "—";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "—";

    }


    return date.toLocaleString(
        "fr-FR",
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function showError(
    title,
    text
) {

    matchHeader.innerHTML = `

        <div class="detail-error">

            <div>
                ⚠️
            </div>

            <h3>
                ${safe(title)}
            </h3>

            <p>
                ${safe(text)}
            </p>

        </div>

    `;


    detailContent.innerHTML = "";

}


/* ================================
   SUMMARY
================================ */

function renderSummary(
    match
) {

    detailContent.innerHTML = `

        <div class="detail-panel">

            <div class="panel-title">
                📋 Résumé du match
            </div>

            <p style="
                color:var(--muted);
                font-size:10px;
                line-height:1.7;
            ">

                ${
                    getStatus(match)
                    === "live"

                    ? "Le match est actuellement en direct. Les informations seront mises à jour automatiquement."

                    : getStatus(match)
                    === "finished"

                    ? "Ce match est terminé. Consultez les statistiques et les événements ci-dessus."

                    : "Le match n'a pas encore commencé."

                }

            </p>

        </div>

    `;

}


/* ================================
   TABS
================================ */

tabs.forEach(
    tab => {

        tab.addEventListener(
            "click",
            () => {

                tabs.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                tab.classList.add(
                    "active"
                );


                const type =
                    tab.dataset.tab;


                if (
                    !window.currentMatch
                ) return;


                if (
                    type === "summary"
                ) {

                    renderSummary(
                        window.currentMatch
                    );

                }

            }
        );

    }
);

/* =====================================================
   PREZISCORE — PART 2
   STATISTIQUES + ÉVÉNEMENTS
===================================================== */


/* =====================================================
   LOAD STATISTICS
===================================================== */

async function loadStatistics() {

    const match =
        window.currentMatch;

    if (!match) return;


    detailContent.innerHTML = `

        <div class="detail-panel">

            <div class="detail-loading">
                📊 Chargement des statistiques...
            </div>

        </div>

    `;


    try {

        const data =
            await apiRequest(
                "/fixtures/statistics",
                {
                    fixture: match.id
                }
            );


        const stats =
            data?.response || [];


        renderStatistics(
            stats
        );


    } catch (error) {

        console.error(
            "Statistics error:",
            error
        );


        detailContent.innerHTML = `

            <div class="detail-panel">

                <div class="panel-title">
                    📊 Statistiques
                </div>

                <p style="
                    color:var(--muted);
                    font-size:10px;
                ">
                    Statistiques non disponibles
                    pour ce match.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER STATISTICS
===================================================== */

function renderStatistics(
    stats
) {

    if (!stats.length) {

        detailContent.innerHTML = `

            <div class="detail-panel">

                <div class="panel-title">
                    📊 Statistiques
                </div>

                <p style="
                    color:var(--muted);
                    font-size:10px;
                ">
                    Aucune statistique disponible.
                </p>

            </div>

        `;

        return;

    }


    const homeStats =
        stats[0]?.statistics || [];

    const awayStats =
        stats[1]?.statistics || [];


    const values = {};


    homeStats.forEach(
        item => {

            values[
                item.type
            ] = {

                home:
                    item.value,

                away:
                    null

            };

        }
    );


    awayStats.forEach(
        item => {

            if (
                !values[item.type]
            ) {

                values[
                    item.type
                ] = {

                    home: null,
                    away: item.value

                };

            } else {

                values[
                    item.type
                ].away =
                    item.value;

            }

        }
    );


    const rows =
        Object.entries(
            values
        );


    detailContent.innerHTML = `

        <div class="detail-panel">

            <div class="panel-title">
                📊 Statistiques
            </div>

            ${
                rows.map(
                    ([name, value]) => {

                        const home =
                            value.home ??
                            "-";

                        const away =
                            value.away ??
                            "-";


                        return `

                            <div class="stat-row">

                                <div class="stat-head">

                                    <span>
                                        ${safe(name)}
                                    </span>

                                    <span>
                                        ${safe(home)}
                                        &nbsp; - &nbsp;
                                        ${safe(away)}
                                    </span>

                                </div>


                                <div class="stat-bars">

                                    <div class="stat-bar">

                                        <div
                                            class="stat-fill"
                                            style="width:${statWidth(home)}%"
                                        ></div>

                                    </div>


                                    <div class="stat-bar">

                                        <div
                                            class="stat-fill"
                                            style="width:${statWidth(away)}%"
                                        ></div>

                                    </div>

                                </div>

                            </div>

                        `;

                    }
                ).join("")
            }

        </div>

    `;

}


/* =====================================================
   STAT WIDTH
===================================================== */

function statWidth(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === "-"
    ) {

        return 0;

    }


    const number =
        parseFloat(
            String(value)
                .replace("%", "")
        );


    if (
        Number.isNaN(number)
    ) {

        return 50;

    }


    return Math.max(
        5,
        Math.min(
            100,
            number
        )
    );

}


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadEvents() {

    const match =
        window.currentMatch;

    if (!match) return;


    detailContent.innerHTML = `

        <div class="detail-panel">

            <div class="detail-loading">
                ⚽ Chargement des événements...
            </div>

        </div>

    `;


    try {

        const data =
            await apiRequest(
                "/fixtures/events",
                {
                    fixture: match.id
                }
            );


        const events =
            data?.response || [];


        renderEvents(
            events
        );


    } catch (error) {

        console.error(
            "Events error:",
            error
        );


        detailContent.innerHTML = `

            <div class="detail-panel">

                <div class="panel-title">
                    ⚽ Événements
                </div>

                <p style="
                    color:var(--muted);
                    font-size:10px;
                ">
                    Événements non disponibles.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(
    events
) {

    if (!events.length) {

        detailContent.innerHTML = `

            <div class="detail-panel">

                <div class="panel-title">
                    ⚽ Événements
                </div>

                <p style="
                    color:var(--muted);
                    font-size:10px;
                ">
                    Aucun événement disponible.
                </p>

            </div>

        `;

        return;

    }


    detailContent.innerHTML = `

        <div class="detail-panel">

            <div class="panel-title">
                ⚽ Événements du match
            </div>


            ${events.map(
                event => {

                    const minute =
                        event.time?.elapsed ??
                        "-";


                    const extra =
                        event.time?.extra
                            ? `+${event.time.extra}`
                            : "";


                    const type =
                        event.type ||
                        "Événement";


                    const detail =
                        event.detail ||
                        "";


                    const player =
                        event.player?.name ||
                        "";


                    const team =
                        event.team?.name ||
                        "";


                    let icon = "⚽";


                    if (
                        type
                        .toLowerCase()
                        .includes("card")
                    ) {

                        icon =
                            detail
                            .toLowerCase()
                            .includes("yellow")
                                ? "🟨"
                                : "🟥";

                    }


                    if (
                        type
                        .toLowerCase()
                        .includes("subst")
                    ) {

                        icon = "🔄";

                    }


                    return `

                        <div class="event-row">

                            <div class="event-time">

                                ${safe(
                                    minute
                                )}'
                                ${safe(
                                    extra
                                )}

                            </div>


                            <div class="event-center">

                                ${icon}

                                ${safe(
                                    player
                                )}

                                ${
                                    detail
                                        ? `
                                            <div class="event-team">
                                                ${safe(detail)}
                                            </div>
                                          `
                                        : ""
                                }

                            </div>


                            <div class="event-team">

                                ${safe(team)}

                            </div>

                        </div>

                    `;

                }
            ).join("")}

        </div>

    `;

}


/* =====================================================
   TAB SYSTEM — PART 2
===================================================== */

tabs.forEach(
    tab => {

        tab.addEventListener(
            "click",
            async () => {

                const type =
                    tab.dataset.tab;


                if (
                    !window.currentMatch
                ) return;


                if (
                    type === "summary"
                ) {

                    renderSummary(
                        window.currentMatch
                    );

                }


                if (
                    type === "stats"
                ) {

                    await loadStatistics();

                }


                if (
                    type === "events"
                ) {

                    await loadEvents();

                }

            }
        );

    }
);
/* ================================
   START
================================ */

loadMatch();

</script>
