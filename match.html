<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#080b10">

<meta name="description"
      content="PreziScore — Scores football en direct">

<title>PreziScore — Matchs</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   PREZISCORE — MATCH PAGE
===================================================== */

.page-head {
    padding: 22px 0 15px;
}

.page-head h2 {
    font-size: 25px;
    letter-spacing: -0.7px;
}

.page-head p {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 12px 14px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 15px;
}

.search-box span {
    font-size: 16px;
}

.search-box input {
    width: 100%;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-family: inherit;
    font-size: 12px;
}

.search-box input::placeholder {
    color: #68717f;
}


/* =====================================================
   FILTER TABS
===================================================== */

.match-tabs {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 14px;
}

.match-tab {
    height: 42px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: var(--card);

    color: var(--muted);

    font-family: inherit;

    font-size: 10px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.2s;
}

.match-tab.active {
    background:
        rgba(0,230,118,0.10);

    border-color:
        rgba(0,230,118,0.30);

    color: var(--primary);
}

.match-tab:active {
    transform: scale(0.96);
}


/* =====================================================
   DATE BAR
===================================================== */

.date-bar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 22px;

    margin-bottom: 10px;
}

.date-bar h3 {
    font-size: 13px;
}

.date-bar span {
    color: var(--muted);
    font-size: 10px;
}


/* =====================================================
   COMPETITION
===================================================== */

.competition {
    margin-top: 16px;
}

.competition-head {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 9px 4px;

    color: var(--muted);

    font-size: 10px;

    font-weight: 800;
}

.competition-icon {
    width: 27px;
    height: 27px;

    display: grid;

    place-items: center;

    background: var(--card-2);

    border-radius: 8px;

    font-size: 13px;
}


/* =====================================================
   MATCH CARD
===================================================== */

.match-item {
    display: block;

    padding: 14px;

    margin-bottom: 8px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    transition: 0.2s;

    cursor: pointer;
}

.match-item:active {
    transform: scale(0.985);
}


/* =====================================================
   MATCH TOP
===================================================== */

.match-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 13px;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    min-height: 20px;

    padding: 4px 8px;

    border-radius: 7px;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 0.2px;
}

.status.live {
    color: #ff304f;

    background:
        rgba(255,48,79,0.10);
}

.status.finished {
    color: #8b95a3;

    background:
        rgba(139,149,163,0.10);
}

.status.upcoming {
    color: var(--primary);

    background:
        rgba(0,230,118,0.08);
}


/* STATUS DOT */

.status-dot {
    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background: currentColor;
}

.status.live .status-dot {
    animation:
        livePulse 1.2s infinite;
}

@keyframes livePulse {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.35;
        transform: scale(0.75);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =====================================================
   MATCH TIME
===================================================== */

.match-time {
    color: var(--muted);

    font-size: 9px;

    font-weight: 600;
}


/* =====================================================
   MATCH BODY
===================================================== */

.match-body {
    display: grid;

    grid-template-columns:
        1fr 76px 1fr;

    align-items: center;

    gap: 6px;

    text-align: center;
}


/* =====================================================
   CLUB
===================================================== */

.club {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    min-width: 0;
}

.club-logo {
    width: 44px;
    height: 44px;

    display: grid;

    place-items: center;

    background: var(--card-2);

    border: 1px solid var(--border);

    border-radius: 12px;

    font-size: 18px;

    overflow: hidden;
}

.club-logo img {
    width: 34px;
    height: 34px;

    object-fit: contain;
}

.club-name {
    width: 100%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 10px;

    font-weight: 700;
}


/* =====================================================
   SCORE
===================================================== */

.score {
    font-size: 20px;

    font-weight: 900;

    letter-spacing: -0.5px;
}

.score small {
    display: block;

    margin-top: 5px;

    color: var(--muted);

    font-size: 8px;

    font-weight: 600;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.no-matches {
    display: none;

    padding: 40px 15px;

    text-align: center;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;
}

.no-matches.show {
    display: block;
}

.no-matches div {
    font-size: 32px;
}

.no-matches h3 {
    margin-top: 10px;

    font-size: 14px;
}

.no-matches p {
    margin-top: 6px;

    color: var(--muted);

    font-size: 10px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {
    padding: 40px 10px;

    text-align: center;

    color: var(--muted);

    font-size: 11px;
}

.loader {
    width: 26px;
    height: 26px;

    margin: 0 auto 10px;

    border: 3px solid
        rgba(255,255,255,0.08);

    border-top-color:
        var(--primary);

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   LIVE CARD
===================================================== */

.match-item.live-match {
    border-color:
        rgba(255,48,79,0.18);
}

.match-item.live-match .score {
    color: #ffffff;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (min-width: 768px) {

    .match-tabs {
        max-width: 500px;
    }

    .match-item {
        padding: 17px;
    }

    .club-name {
        font-size: 11px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="brand">

        <div class="brand-ball">
            ⚽
        </div>

        <div>

            <h1>
                Prezi<span>Score</span>
            </h1>

            <p>
                Football en direct
            </p>

        </div>

    </div>

    <button
        class="search-btn"
        onclick="focusSearch()"
        aria-label="Rechercher"
    >
        🔍
    </button>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main-content">

    <section class="page-head">

        <h2>
            Matchs
        </h2>

        <p>
            Suivez les résultats football
            partout dans le monde.
        </p>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <span>🔍</span>

        <input
            id="searchInput"
            type="search"
            placeholder="Rechercher une équipe..."
            autocomplete="off"
        >

    </div>


    <!-- FILTERS -->

    <div class="match-tabs">

        <button
            class="match-tab active"
            data-filter="live"
        >
            🔴 LIVE
        </button>

        <button
            class="match-tab"
            data-filter="upcoming"
        >
            📅 À VENIR
        </button>

        <button
            class="match-tab"
            data-filter="finished"
        >
            ✅ TERMINÉS
        </button>

    </div>


    <!-- DATE -->

    <div class="date-bar">

        <h3 id="dateTitle">
            Aujourd'hui
        </h3>

        <span id="matchCount">
            0 matchs
        </span>

    </div>


    <!-- MATCH CONTAINER -->

    <section id="matchesContainer">

        <div
            class="loading"
            id="loading"
        >

            <div class="loader"></div>

            Chargement des matchs...

        </div>

    </section>


    <!-- EMPTY -->

    <div
        class="no-matches"
        id="noMatches"
    >

        <div>⚽</div>

        <h3>
            Aucun match trouvé
        </h3>

        <p>
            Aucun match ne correspond
            à votre recherche.
        </p>

    </div>

            </main>

    <!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">

    <a
        href="index.html"
        class="nav-item"
    >

        <span>⌂</span>

        <small>
            Accueil
        </small>

    </a>


    <a
        href="match.html"
        class="nav-item active"
    >

        <span>⚽</span>

        <small>
            Matchs
        </small>

    </a>


    <a
        href="competitions.html"
        class="nav-item"
    >

        <span>🏆</span>

        <small>
            Compétitions
        </small>

    </a>


    <a
        href="news.html"
        class="nav-item"
    >

        <span>📰</span>

        <small>
            News
        </small>

    </a>


    <a
        href="profile.html"
        class="nav-item"
    >

        <span>👤</span>

        <small>
            Profil
        </small>

    </a>

</nav>


<!-- =====================================================
     API
===================================================== -->

<script src="api.js"></script>


<!-- =====================================================
     MATCH ENGINE
===================================================== -->

<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const matchesContainer =
    document.getElementById(
        "matchesContainer"
    );

const loading =
    document.getElementById(
        "loading"
    );

const noMatches =
    document.getElementById(
        "noMatches"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const matchCount =
    document.getElementById(
        "matchCount"
    );

const dateTitle =
    document.getElementById(
        "dateTitle"
    );


/* =====================================================
   STATE
===================================================== */

let allMatches = [];

let currentFilter = "live";

let isLoading = false;


/* =====================================================
   LOAD ALL MATCHES
===================================================== */

async function loadMatches() {

    if (isLoading) return;

    isLoading = true;

    showLoading();


    try {

        if (
            !window.PreziAPI
        ) {

            throw new Error(
                "PreziAPI pa disponib"
            );

        }


        const matches =
            await PreziAPI
                .getNormalizedMatches();


        allMatches =
            Array.isArray(matches)
                ? matches
                : [];


        console.log(
            "PreziScore matches:",
            allMatches
        );


        renderMatches();


    }

    catch (error) {

        console.error(
            "PreziScore:",
            error
        );


        allMatches = [];


        showEmpty(
            "⚠️",
            "Erreur de chargement",
            "Nou pa kapab jwenn match yo kounye a."
        );

    }


    finally {

        isLoading = false;

    }

}


/* =====================================================
   LOADING
===================================================== */

function showLoading() {

    noMatches.classList.remove(
        "show"
    );

    matchesContainer.innerHTML = "";

    matchesContainer.appendChild(
        loading
    );

    loading.style.display =
        "block";

}


/* =====================================================
   FILTER
===================================================== */

function getFilteredMatches() {

    let result =
        allMatches.filter(
            match => {

                return (
                    match.status ===
                    currentFilter
                );

            }
        );


    /* SEARCH */

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    if (query) {

        result =
            result.filter(
                match => {

                    const home =
                        String(
                            match.home?.name || ""
                        ).toLowerCase();


                    const away =
                        String(
                            match.away?.name || ""
                        ).toLowerCase();


                    const competition =
                        String(
                            match.competition || ""
                        ).toLowerCase();


                    return (
                        home.includes(query) ||
                        away.includes(query) ||
                        competition.includes(query)
                    );

                }
            );

    }


    return result;

}


/* =====================================================
   RENDER
===================================================== */

function renderMatches() {

    loading.style.display =
        "none";

    matchesContainer.innerHTML = "";


    const matches =
        getFilteredMatches();


    matchCount.textContent =
        `${matches.length} ${
            matches.length === 1
                ? "match"
                : "matchs"
        }`;


    /* EMPTY */

    if (!matches.length) {

        showEmpty(
            currentFilter === "live"
                ? "🔴"
                : currentFilter === "upcoming"
                    ? "📅"
                    : "✅",

            currentFilter === "live"
                ? "Aucun match en direct"
                : currentFilter === "upcoming"
                    ? "Aucun match à venir"
                    : "Aucun match terminé",

            currentFilter === "live"
                ? "Les matchs en cours apparaîtront ici automatiquement."
                : currentFilter === "upcoming"
                    ? "Les prochains matchs apparaîtront ici automatiquement."
                    : "Les matchs terminés apparaîtront ici automatiquement."
        );

        return;

    }


    noMatches.classList.remove(
        "show"
    );


    /* =================================================
       GROUP COMPETITIONS
    ================================================= */

    const groups = {};


    matches.forEach(
        match => {

            const competition =
                match.competition ||
                "Football";


            if (!groups[competition]) {

                groups[competition] = [];

            }


            groups[competition].push(
                match
            );

        }
    );


    Object.entries(groups)
        .forEach(
            ([competition, games]) => {

                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "competition";


                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "competition-head";


                header.innerHTML = `

                    <div class="competition-icon">
                        🏆
                    </div>

                    <span>
                        ${escapeHTML(
                            competition
                        )}
                    </span>

                `;


                section.appendChild(
                    header
                );


                games.forEach(
                    match => {

                        section.appendChild(
                            createMatchCard(
                                match
                            )
                        );

                    }
                );


                matchesContainer.appendChild(
                    section
                );

            }
        );

}


/* =====================================================
   MATCH CARD
===================================================== */

function createMatchCard(match) {

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "match-item";


    if (
        match.status === "live"
    ) {

        article.classList.add(
            "live-match"
        );

    }


    /* STATUS */

    let statusText =
        "À VENIR";

    let statusClass =
        "upcoming";


    if (
        match.status === "live"
    ) {

        statusClass =
            "live";


        statusText =
            getLiveStatus(
                match
            );

    }

    else if (
        match.status === "finished"
    ) {

        statusClass =
            "finished";

        statusText =
            "TERMINÉ";

    }


    /* SCORES */

    const homeScore =
        match.home?.score ??
        "-";


    const awayScore =
        match.away?.score ??
        "-";


    /* CARD */

    article.innerHTML = `

        <div class="match-top">

            <div class="status ${statusClass}">

                <span class="status-dot"></span>

                <span>
                    ${escapeHTML(
                        statusText
                    )}
                </span>

            </div>


            <div class="match-time">

                ${escapeHTML(
                    formatMatchTime(match)
                )}

            </div>

        </div>


        <div class="match-body">


            <!-- HOME -->

            <div class="club">

                <div class="club-logo">

                    ${
                        match.home?.logo

                            ? `

                                <img
                                    src="${escapeAttribute(
                                        match.home.logo
                                    )}"
                                    alt=""
                                    loading="lazy"
                                >

                              `

                            : "⚽"
                    }

                </div>


                <div class="club-name">

                    ${escapeHTML(
                        match.home?.name ||
                        "Équipe domicile"
                    )}

                </div>

            </div>


            <!-- SCORE -->

            <div class="score">

                ${escapeHTML(
                    homeScore
                )}

                <span>
                    -
                </span>

                ${escapeHTML(
                    awayScore
                )}


                <small>

                    ${
                        match.status === "live"
                            ? "EN DIRECT"
                            : match.status === "finished"
                                ? "FT"
                                : "À VENIR"
                    }

                </small>

            </div>


            <!-- AWAY -->

            <div class="club">

                <div class="club-logo">

                    ${
                        match.away?.logo

                            ? `

                                <img
                                    src="${escapeAttribute(
                                        match.away.logo
                                    )}"
                                    alt=""
                                    loading="lazy"
                                >

                              `

                            : "⚽"
                    }

                </div>


                <div class="club-name">

                    ${escapeHTML(
                        match.away?.name ||
                        "Équipe visiteuse"
                    )}

                </div>

            </div>


        </div>

    `;


    /* CLICK MATCH */

    article.addEventListener(
        "click",
        () => {

            if (
                match.slug
            ) {

                window.location.href =
                    "match-details.html?match=" +
                    encodeURIComponent(
                        match.slug
                    );

            }

        }
    );


    return article;

}


/* =====================================================
   LIVE STATUS
===================================================== */

function getLiveStatus(match) {

    const minute =
        match.minute;


    if (
        minute !== null &&
        minute !== undefined &&
        minute !== ""
    ) {

        return `LIVE • ${minute}'`;

    }


    return "LIVE";

}


/* =====================================================
   MATCH TIME
===================================================== */

function formatMatchTime(match) {

    if (
        match.status === "live"
    ) {

        return "En cours";

    }


    if (
        match.status === "finished"
    ) {

        return "Terminé";

    }


    const start =
        match.raw?.start_time ||
        match.raw?.startTime ||
        match.raw?.date ||
        match.raw?.start_at;


    if (!start) {

        return "--:--";

    }


    const date =
        new Date(start);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "--:--";

    }


    return date.toLocaleTimeString(
        "fr-FR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   EMPTY
===================================================== */

function showEmpty(
    icon,
    title,
    text
) {

    loading.style.display =
        "none";


    matchesContainer.innerHTML =
        "";


    noMatches.innerHTML = `

        <div>
            ${icon}
        </div>

        <h3>
            ${escapeHTML(title)}
        </h3>

        <p>
            ${escapeHTML(text)}
        </p>

    `;


    noMatches.classList.add(
        "show"
    );

}
<!-- =====================================================
     SEARCH ENGINE
===================================================== -->

<script>

searchInput.addEventListener(
    "input",
    () => {

        renderMatches();

    }
);


/* =====================================================
   TABS
===================================================== */

document
    .querySelectorAll(".match-tab")
    .forEach(tab => {

        tab.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".match-tab"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                tab.classList.add(
                    "active"
                );


                currentFilter =
                    tab.dataset.filter;


                renderMatches();

            }
        );

    });


/* =====================================================
   SEARCH BUTTON
===================================================== */

function focusSearch() {

    if (
        searchInput
    ) {

        searchInput.focus();

    }

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(value) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    );

}


/* =====================================================
   DATE
===================================================== */

function updateDateTitle() {

    const today =
        new Date();


    dateTitle.textContent =
        today.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startPreziRefresh() {

    if (
        window.PreziLive &&
        typeof PreziLive.start === "function"
    ) {

        PreziLive.start(
            () => {

                loadMatches();

            },
            60
        );

        return;

    }


    /*
       Fallback si PreziLive
       pa disponib.
    */

    setInterval(
        () => {

            loadMatches();

        },
        60 * 1000
    );

}


/* =====================================================
   STOP REFRESH WHEN PAGE CLOSES
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            window.PreziLive &&
            typeof PreziLive.stop === "function"
        ) {

            PreziLive.stop();

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateDateTitle();

loadMatches();

startPreziRefresh();

</script>

<script src="api.js"></script>
<script src="script.js"></script>
<!-- =====================================================
     END PREZISCORE MATCH PAGE
===================================================== -->

</body>

</html>
