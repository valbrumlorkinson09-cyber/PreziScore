<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#080b10">

    <meta name="description"
          content="PreziScore — Scores football en direct">

    <title>PreziScore — Matchs</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="brand">

        <div class="brand-ball">
            ⚽
        </div>

        <div>

            <h1>
                Prezi<span>Score</span>
            </h1>

            <p>
                Football en direct
            </p>

        </div>

    </div>


    <button
        class="search-btn"
        onclick="focusSearch()"
        aria-label="Rechercher"
    >
        🔍
    </button>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main-content">

    <section class="page-head">

        <h2>
            Matchs
        </h2>

        <p>
            Suivez les résultats football
            partout dans le monde.
        </p>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <span>🔍</span>

        <input
            id="searchInput"
            type="search"
            placeholder="Rechercher une équipe..."
            autocomplete="off"
        >

    </div>


    <!-- FILTERS -->

    <div class="match-tabs">

        <button
            class="match-tab active"
            data-filter="live"
        >
            🔴 LIVE
        </button>


        <button
            class="match-tab"
            data-filter="upcoming"
        >
            📅 À VENIR
        </button>


        <button
            class="match-tab"
            data-filter="finished"
        >
            ✅ TERMINÉS
        </button>

    </div>


    <!-- DATE -->

    <div class="date-bar">

        <h3 id="dateTitle">
            Aujourd'hui
        </h3>

        <span id="matchCount">
            0 matchs
        </span>

    </div>


    <!-- MATCHES -->

    <section id="matchesContainer">

        <div
            class="loading"
            id="loading"
        >

            <div class="loader"></div>

            Chargement des matchs...

        </div>

    </section>


    <!-- EMPTY -->

    <div
        class="no-matches"
        id="noMatches"
    >

        <div>⚽</div>

        <h3>
            Aucun match trouvé
        </h3>

        <p>
            Aucun match ne correspond
            à votre recherche.
        </p>

    </div>

</main>

     BOTTOM NAVIGATION
===================================================== -->

    <a

        <span>⌂</span>

        <small>
            Accueil
        </small>

    </a>


    <a

        class="nav-item active"
    >

        <span>⚽</span>

        <small>

        </small>

    </a>


    <a
        href="competitions.html"
        class="nav-item"
    >

        <span>🏆</span>

        <small>
            Compétitions
        </small>

    </a>


    <a
        href="news.html"
        class="nav-item"
    >

        <span>📰</span>

        <small>
            News
        </small>

    </a>


    <a
        href="profile.html"
        class="nav-item"
    >

        <span>👤</span>

        <small>
            Profil
        </small>

    </a>

</nav>
